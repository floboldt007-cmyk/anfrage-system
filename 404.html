<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Seite nicht gefunden | anfrageprofi</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231d4ed8'/><path d='M9 8h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9l-4 4v-4H9a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z' fill='%23ffffff'/><path d='M11.5 14.5l3 3 6-6' fill='none' stroke='%231d4ed8' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #fff; background: linear-gradient(165deg, #0f1f3d 0%, #14305f 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .box { max-width: 520px; }
    .code { font-size: 4.5rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: #60a5fa; }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 14px 0 12px; }
    p { color: #b8c4d6; font-size: 1.05rem; margin-bottom: 28px; }
    .btn { display: inline-block; background: #fff; color: #0f1f3d; text-decoration: none; padding: 13px 26px; border-radius: 9px; font-weight: 600; transition: transform 0.1s; }
    .btn:hover { transform: translateY(-1px); }
    .klein { display: block; margin-top: 18px; font-size: 0.92rem; }
    .klein a { color: #b8c4d6; }
    .klein a:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Diese Seite gibt es nicht</h1>
    <p>Der Link ist vielleicht veraltet oder hat sich vertippt. Kein Problem, zurück zur Startseite und alles ist wieder da.</p>
    <a class="btn" href="/">Zur Startseite</a>
    <span class="klein"><a href="/#kontakt">Oder direkt Kontakt aufnehmen</a></span>
  </div>

</html>
